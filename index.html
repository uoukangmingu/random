<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>스포츠관광 국가별 문제풀이</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <div>
        <p class="eyebrow">스포츠관광 기말 대비</p>
        <h1>국가별 문제풀이</h1>
        <p class="sub">핀란드 · 캐나다 · 미국 · 호주 · 필리핀 · 중국 · 일본 · 한국 퀴즈 전용</p>
      </div>
      <button id="resetStatsBtn" class="ghost">기록 초기화</button>
    </section>

    <section id="setup" class="card setup">
      <h2>문제 세트 설정</h2>
      <label>국가 선택</label>
      <div id="countryChips" class="chips"></div>
      <label>문제 수</label>
      <div class="chips small">
        <button class="chip count active" data-count="10">10문제</button>
        <button class="chip count" data-count="20">20문제</button>
        <button class="chip count" data-count="40">40문제</button>
        <button class="chip count" data-count="all">전체</button>
      </div>
      <label>출제 방식</label>
      <div class="toggle-row">
        <label><input type="checkbox" id="shuffleChoices" checked /> 보기 섞기</label>
        <label><input type="checkbox" id="wrongOnly" /> 많이 틀린 문제만</label>
      </div>
      <button id="startBtn" class="primary">문제 풀기 시작</button>

      <div class="study-order-panel">
        <label for="studyOrderSelect">정답 암기 모드 문제 순서</label>
        <select id="studyOrderSelect">
          <option value="random">랜덤</option>
          <option value="likely">출제유력순</option>
          <option value="hard">어려운 순</option>
          <option value="easy">쉬운 순</option>
        </select>
        <p class="order-help">출제유력순은 지금까지의 문제 성향을 기준으로 정책·시사점·장소성·대표사례·비교 문제를 앞에 배치합니다.</p>
      </div>
      <button id="studyModeBtn" class="secondary">정답 암기 모드 시작</button>
      <p id="setupInfo" class="muted"></p>
    </section>

    <section id="quiz" class="card quiz hidden">
      <div class="topbar">
        <button id="backBtn" class="ghost">← 설정</button>
        <div class="progress"><div id="progressBar"></div></div>
        <span id="counter">1/10</span>
      </div>
      <p id="countryTag" class="tag"></p>
      <h2 id="questionText"></h2>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="nextBtn" class="primary hidden">다음 문제</button>
    </section>

    <section id="study" class="card study hidden">
      <div class="topbar">
        <button id="studyBackBtn" class="ghost">← 설정</button>
        <div class="progress"><div id="studyProgressBar"></div></div>
        <span id="studyCounter">1/1</span>
      </div>
      <p id="studyCountryTag" class="tag"></p>
      <h2 id="studyQuestionText"></h2>
      <div id="studyChoices" class="choices study-choices"></div>
      <div id="studyAnswerBox" class="answer-box"></div>
      <div class="study-nav">
        <button id="studyPrevBtn" class="ghost">이전</button>
        <button id="studyShuffleBtn" class="ghost">다시 섞기</button>
        <button id="studyNextBtn" class="primary">다음</button>
      </div>
    </section>

    <section id="result" class="card result hidden">
      <p class="eyebrow">결과</p>
      <h2 id="scoreText"></h2>
      <p id="resultText" class="sub"></p>
      <div id="wrongList" class="wrong-list"></div>
      <div class="actions">
        <button id="retryWrongBtn" class="primary">틀린 문제 다시 풀기</button>
        <button id="restartBtn" class="ghost">새 세트 풀기</button>
      </div>
    </section>
  </main>
  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
